<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTC2 Connect - Hệ Thống Xác Thực</title>
    
    <!-- Import Phông Chữ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#101B33" />
  
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UTC2 Connect">
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png">
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
</style>
</head>
<body>

    <div id="root"></div>
    
    <!-- Nạp file khởi tạo React (Dành cho môi trường Vite) -->
    <script type="module" src="/src/main.jsx">

        if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ PWA Service Worker đã hoạt động!'))
          .catch(err => console.log('❌ Lỗi Service Worker: ', err));
      });
    }
    </script>

</body>
</html>
