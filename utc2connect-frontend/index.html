<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UTC2 Connect - Hệ Thống Xác Thực</title>
    
    <!-- Import Phông Chữ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#101B33" />
  
    <!-- Đã sửa đường dẫn chuẩn cho Vite (bỏ %PUBLIC_URL%) -->
    <link rel="manifest" href="/manifest.json" />
  
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UTC2 Connect">
    <link rel="apple-touch-icon" href="/logo192.png">

    <style>
      /* Reset & Giải phóng cuộn dọc toàn trang cho Mobile */
      *, *::before, *::after { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
      }
      
      html, body {
        width: 100% !important;
        height: auto !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important; /* Mở quyền cuộn dọc cho điện thoại */
        -webkit-overflow-scrolling: touch !important; /* Vuốt mượt trên Safari iOS */
        position: static !important;
      }

      #root {
        width: 100% !important;
        height: auto !important;
        min-height: 100% !important;
        overflow: visible !important;
      }
    </style>
</head>
<body>

    <div id="root"></div>
    
    <!-- 1. Thẻ nạp file chính của React Vite (Để trống thẻ đóng) -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- 2. Thẻ riêng biệt đăng ký PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ PWA Service Worker đã hoạt động!'))
            .catch(err => console.log('❌ Lỗi Service Worker: ', err));
        });
      }
    </script>

</body>
</html>
